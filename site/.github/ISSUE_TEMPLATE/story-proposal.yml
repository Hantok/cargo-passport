name: Propose a story
description: Suggest a question about fire and weightlessness for the library to look into.
title: "Proposal: "
labels: ["story-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. A proposal waits until it has at least one thumbs-up reaction. Ask others to add one if you want it developed.
  - type: textarea
    id: question
    attributes:
      label: The question
      description: What do you want to know? One question, in plain words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who would care about the answer, and why?
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What you would like to see
      description: For example a short story, a diagram, a comparison, or an honest "nobody has tested this".
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Any source you know (optional)
      description: A link or a title. It is not checked when you post it. The library only uses a source after its quote is checked.
